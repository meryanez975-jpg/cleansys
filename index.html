<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleaSys — Sistema de Limpieza</title>
    <script>
      // Cada link de tienda trae su propio manifiesto desde el inicio, así el
      // celular la instala como app aparte (con el general, scope "/", decía
      // "abrir en la app" en vez de instalar).
      (function () {
        var m = location.pathname.match(/^\/(tienda|sede|marcar)\/([a-z0-9-]+)\/?(marcar)?\/?$/i)
        var href = '/manifest.json'
        if (m) href = '/api/manifest?slug=' + m[2].toLowerCase() + (m[1] === 'marcar' || m[3] ? '&tipo=marcar' : '')
        document.write('<link rel="manifest" href="' + href + '" />')
      })()
    </script>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F2F6FC" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
